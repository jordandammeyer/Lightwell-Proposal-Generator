  --navy:#00143D; --yellow:#FFB600; --cream:#FCF4D7; --gray:#CCCDCD; --teal:#2DB4A5;
  --ink:#1d2433; --muted:#667085; --line:#d9dce3; --bg:#eef0f4; --panel:#ffffff; --warn:#b42318;
  --ui:"Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --sans:"Haffer","LW Sans",Arial,sans-serif;
  --serif:"Tiempos Text","LW Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
#top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px}
#top .mark{width:26px;height:26px;flex:none}
#top .name{display:flex;flex-direction:column;line-height:1.25;min-width:0}
#top .name b{font-size:13px;font-weight:600}
#top .name span{font-size:11px;color:#9fb0cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .spacer{flex:1}
#top .dirty{font-size:11px;color:var(--yellow)}
.tbtn{background:transparent;border:1px solid #33456e;color:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px}
.tbtn:hover{background:#0f2552}
.tbtn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--navy);font-weight:700}
.tbtn.primary:hover{filter:brightness(1.05)}
#main{display:grid;grid-template-columns:250px minmax(420px,1fr) minmax(360px,46%);min-height:0}
#main.nopreview{grid-template-columns:250px 1fr 0}
#main.nopreview #previewPane{display:none}

/* nav */
#nav{background:#f8f9fb;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#navList{overflow-y:auto;flex:1;padding:8px}
.nitem{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:7px 9px;cursor:pointer;margin-bottom:2px}
.nitem:hover{background:#eef1f6}
.nitem.on{background:#fff;border-color:var(--line);box-shadow:inset 3px 0 0 var(--yellow)}
.nitem b{display:block;font-size:12px;font-weight:600}
.nitem span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .pb{font-size:10px;color:#98a2b3}
#navAdd{padding:10px;border-top:1px solid var(--line)}
#navAdd select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff}

/* editor */
#editor{overflow-y:auto;padding:18px 22px 60px;min-height:0}
.ehead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ehead h2{font-size:17px;margin:0;color:var(--navy);flex:1;min-width:160px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
.btn:hover{background:#f3f5f9}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--warn)}
.btn.sm{padding:2px 7px;font-size:11px}
.ibtn{border:none;background:none;cursor:pointer;color:#98a2b3;padding:2px 4px;border-radius:4px;font-size:13px;line-height:1}
.ibtn:hover{color:var(--navy);background:#eef1f6}
.ibtn.x:hover{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card .chead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card .ctype{font-size:11px;color:var(--muted);text-transform:none;font-weight:600;flex:1}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label,.lbl{font-size:11px;font-weight:600;color:#475467}
.f input,.f textarea,.f select,.inp{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff;width:100%}
.f textarea{min-height:70px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 2fr 2fr auto;gap:8px;align-items:end}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#344054;margin-right:14px;cursor:pointer}
.hint{font-size:11px;color:var(--muted);margin:4px 0 10px;line-height:1.45}
.lock{background:#f8f9fb;border:1px dashed var(--line);border-radius:6px;padding:10px;font-size:12px;color:#475467;line-height:1.5}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* grid editor */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.g{border-collapse:collapse;width:100%;min-width:100%}
table.g th,table.g td{border-bottom:1px solid #edf0f4;padding:0;vertical-align:middle}
table.g th{background:var(--cream);font-weight:600}
table.g input{border:none;background:transparent;padding:6px 7px;width:100%;min-width:70px}
table.g input:focus{background:#fffbea;outline:none;box-shadow:inset 0 0 0 1px var(--yellow)}
table.g input:disabled{color:#98a2b3;font-style:italic}
table.g td.ctl,table.g th.ctl{width:1%;white-space:nowrap;padding:0 4px;background:#fafbfc}
table.g select{border:none;background:transparent;font-size:11px;color:#475467;padding:4px 2px}
table.g tr.s-sub td:nth-child(2) input{padding-left:22px}
table.g tr.s-hl td{background:#fff8dc}
table.g tr.s-grp td input,table.g tr.s-bold td input{font-weight:700}
.thc{display:flex;align-items:center}
.thc input{font-weight:600}
.litem{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.litem input{flex:1}
.litem.l1{padding-left:26px}

/* preview */
#previewPane{background:#5f6673;overflow:auto;min-height:0;position:relative}
#previewBar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:#4b515c;color:#e4e7ec;padding:6px 12px;font-size:11px}
#previewBar input{width:110px}
#pv{padding:18px 0 40px;display:flex;justify-content:center}
#pv .doc{zoom:var(--z,.55)}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,20,61,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#mbox{background:#fff;border-radius:10px;width:min(640px,94vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#mbox h3{margin:0 0 6px;color:var(--navy);font-size:16px}
#mbox p{line-height:1.5;margin:6px 0 12px;color:#344054}
#mbox textarea{width:100%;min-height:220px;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.choice:hover{border-color:var(--yellow);background:#fffdf5}
.choice b{display:block;color:var(--navy);margin-bottom:3px}
.choice span{color:var(--muted);font-size:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#toast.on{opacity:1}

/* ================= DOCUMENT (preview + print) ================= */
.doc{width:8.5in;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.35);margin-bottom:.3in}
.flow{padding:.55in 0 .7in}

/* cover */
.cover{position:relative;width:8.5in;height:10.98in;overflow:hidden;background:#fff;font-family:var(--sans);color:var(--navy)}
.cover .logo{position:absolute;left:.92in;top:1.42in;width:3.75in}
.cover .tile{position:absolute}
.cover .dot{position:absolute;border-radius:50%;background:var(--yellow)}
.cover h1{position:absolute;left:.92in;top:3.05in;width:6.8in;margin:0;font-family:var(--sans);font-weight:800;font-size:49pt;line-height:1.02;letter-spacing:1.5pt;text-transform:uppercase;color:var(--navy)}
.cover .ins{position:absolute;left:.92in;top:4.92in;width:6.9in;font-family:var(--serif);font-weight:600;font-size:25pt;line-height:1.15;color:var(--teal)}
.cover .dates{font-family:var(--serif);font-weight:400;font-size:20pt;margin-top:4pt}
.cover .prep{position:absolute;left:.92in;top:6.3in;width:6.8in}
.cover .prep .pl{font-size:19pt;letter-spacing:2pt;font-weight:400;margin-bottom:16pt}
.cover .prep .pp{font-size:15pt;letter-spacing:1.4pt;font-weight:500;line-height:1.35}
.cover .contact{position:absolute;right:.83in;top:9.25in;text-align:right;font-size:13pt;letter-spacing:1.5pt;line-height:1.55;font-weight:400}
.cover .dash{position:absolute;right:.83in;top:8.82in;width:.54in;height:.09in;background:#F6C852}

/* section bar + text */
.sec{margin-top:16pt}
.sec:first-child{margin-top:0}
.bar{background:var(--navy);color:#fff;font-weight:700;font-size:10.5pt;letter-spacing:1.6pt;text-transform:uppercase;padding:4.5pt .55in 4.5pt .55in;break-after:avoid;page-break-after:avoid}
.in{padding:0 .55in}
.carrier{font-style:italic;font-size:10.5pt;margin:12pt 0 0}
.blk{margin-top:11pt;break-inside:auto}
.bh{color:var(--navy);font-weight:700;font-size:10.5pt;margin:0 0 6pt;break-after:avoid;page-break-after:avoid}
.doc p{margin:0 0 6pt}
.doc ul,.doc ol{margin:0 0 4pt;padding-left:24pt}
.doc li{margin:0 0 2.5pt}
.doc ol ol{list-style:lower-alpha;margin-top:2pt}
.doc ul ul{list-style:circle;margin-top:2pt}
.kv p{margin:0 0 4pt}
.pbreak{display:none}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:9.5pt}
table.t th{background:var(--cream);color:var(--navy);font-weight:700;text-align:left;padding:4pt 4pt;border:.75pt solid #6b6b6b;vertical-align:middle;line-height:1.15}
table.t td{border:.75pt solid #a3a3a3;padding:2.2pt 4pt;vertical-align:top}
table.t tr{break-inside:avoid;page-break-inside:avoid}
table.t thead{display:table-header-group}
table.t .c{text-align:center}
table.t .r{text-align:right}
table.t tr.s-sub td:first-child{padding-left:16pt}
table.t tr.s-hl td{background:var(--cream)}
table.t tr.s-bold td,table.t tr.s-total td{font-weight:700}
table.t tr.s-grp td{font-weight:700}
table.t tr.s-total td{border-top:1.25pt solid #444}
.foot{font-size:9pt;margin-top:6pt;white-space:pre-wrap}

/* acceptance */
.ack-intro{margin-top:12pt}
.box{display:inline-block;width:10pt;height:10pt;border:1pt solid #222;vertical-align:middle;position:relative}
.box.x::before,.box.x::after{content:"";position:absolute;left:4.2pt;top:-1pt;width:1.2pt;height:11pt;background:#000;transform:rotate(45deg)}
.box.x::after{transform:rotate(-45deg)}
.ackbox{background:var(--cream);border-left:3pt solid var(--yellow);padding:8pt 10pt;margin:12pt 0 0;line-height:1.5;white-space:pre-wrap;break-inside:avoid}
.sigs{display:grid;grid-template-columns:2.2fr 1.6fr 1.3fr 1fr;gap:16pt;margin-top:26pt;break-inside:avoid}
.sigs .ln{border-bottom:1pt solid #000;height:24pt}
.sigs .sl{font-size:8pt;color:#444;margin-top:3pt;text-transform:uppercase;letter-spacing:.4pt}
.orgline{margin-top:18pt;break-inside:avoid}
.orgline .osl{font-size:8pt;color:#444;margin-top:3pt;text-transform:uppercase;letter-spacing:.4pt}
.orgline .ln{border-bottom:1pt solid #000;min-height:18pt;padding-bottom:2pt;font-size:11pt}

/* e-delivery consent (final copy) */
.consent{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10pt;line-height:1.36;padding-top:4pt}
.consent .clogo{width:2.3in;display:block;margin:0 0 9pt}
.consent .crule{border-top:1.5pt solid #C9A227;border-bottom:.75pt solid #C9A227;height:3pt;margin-bottom:14pt}
.consent h2{color:#27416b;font-size:15.5pt;margin:0 0 12pt}
.consent .cs{color:#27416b;font-weight:700;margin:10pt 0 10pt}
.consent ol{padding-left:0;list-style:none;margin:0}
.consent ol li{display:grid;grid-template-columns:18pt 1fr;margin-bottom:7pt}
.consent ol li b{font-weight:700}
.auth{background:#f3f0ea;border:.75pt solid #d8d4cc;border-radius:5pt;padding:11pt 15pt 12pt;margin-top:16pt;break-inside:avoid}
.auth h4{margin:0;color:#27416b;font-size:11.5pt}
.auth .asub{font-size:8.5pt;color:#555;margin:1pt 0 9pt}
.auth .ag{display:grid;grid-template-columns:1fr 1fr;column-gap:16pt;row-gap:7pt}
.auth .ag.sig{grid-template-columns:1.45fr 1fr}
.auth .full{grid-column:1/-1}
.auth .al{font-size:7.5pt;font-weight:700;color:#555;margin-bottom:2pt;text-transform:uppercase}
.auth .af{background:#fff;border:.75pt solid #888;height:19pt;padding:3pt 5pt;font-size:10pt}
.auth .anote{font-size:7.5pt;font-style:italic;color:#555;margin-top:4pt}
.cfoot{display:flex;justify-content:space-between;font-size:8pt;color:#666;border-top:.5pt solid #ccc;margin-top:18pt;padding-top:5pt}

/* preview-only page-break marker */
#pv .sec.np{position:relative}
#pv .sec.np::before{content:"New page";position:absolute;top:-13pt;right:.55in;font-size:7pt;color:#98a2b3;letter-spacing:.5pt}
#pv .sec.np{border-top:1px dashed #c6cbd4;padding-top:14pt;margin-top:22pt}
#pv .sec.np:first-child{border-top:none;margin-top:0;padding-top:0}
#pv .sec.np:first-child::before{display:none}

/* ---------- money + calc ---------- */
function num(v){ const s=String(v==null?"":v).trim(); if(!s) return NaN; const neg=/^\(.*\)$/.test(s)||/^-/.test(s); const c=s.replace(/[$,\s()+-]/g,""); if(!/^\d+(\.\d+)?$/.test(c)) return NaN; return neg?-parseFloat(c):parseFloat(c); }
function money(n){ return isNaN(n)?"":(n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-US"); }
function pct(from,to){ if(isNaN(from)||isNaN(to)||from===0) return ""; const p=(to-from)/from*100; return (p>0?"+":"")+p.toFixed(1)+"%"; }
function calcCell(col, cells){
  if(!col.calc) return null;
  const v=i=>num(cells[i]);
  if(col.calc.op==="sum"){ const vals=col.calc.of.map(v); if(vals.every(isNaN)) return ""; return money(vals.reduce((a,b)=>a+(isNaN(b)?0:b),0)); }
  if(col.calc.op==="yoy"){ return pct(v(col.calc.of[0]), v(col.calc.of[1])); }
  return "";
}

function renderCover(){
  const c=S.cover; const sq=.905, x0=4.95, y0=.53; const b=1.127, bx=.91, by=8.21;
  const tile=(x,y,s,color,corner)=>`<div class="tile" style="left:${x}in;top:${y}in;width:${s}in;height:${s}in;background:${color};${corner?`border-${corner}-radius:${s}in`:""}"></div>`;
  const Y="#FFB500", Nv="#00143D", G="#CCCDCD";
  const tiles = tile(x0,y0,sq,Y,"top-left")+tile(x0+sq,y0,sq,G)+tile(x0+2*sq,y0,sq,Nv,"bottom-left")+tile(x0+sq,y0+sq,sq,Nv,"bottom-left")+tile(x0+2*sq,y0+sq,sq,Y,"bottom-right")+
    `<div class="dot" style="left:5.34in;top:1.69in;width:.2in;height:.2in"></div>`+
    tile(bx,by,b,Y,"top-left")+tile(bx+b,by,b,Nv,"top-left")+tile(bx,by+b,b,Nv,"top-left")+tile(bx+b,by+b,b,G)+tile(bx+2*b,by+b,b,Y,"top-right")+
    `<div class="dot" style="left:3.55in;top:8.77in;width:.25in;height:.25in"></div>`;
  const preps=(c.preparers||[]).filter(p=>p.name||p.title).map(p=>`<div>${esc(p.name)}${p.title?", "+esc(p.title):""}</div>`).join("");
  const contacts=[c.phone,...(c.preparers||[]).map(p=>p.email)].filter(Boolean).map(v=>`<div>${esc(v)}</div>`).join("");
  return `<div class="cover sheet">${tiles}
    <img class="logo" src="${LOGO}" alt="Lightwell">
    <h1>${esc(c.title||"Risk Solution Proposal")}</h1>
    <div class="ins">${esc(c.insured||"[Insured Name]")}<div class="dates">${esc(c.dates||"[Effective Dates]")}</div></div>
    <div class="prep"><div class="pl">Prepared By :</div><div class="pp">${preps||"<div>[Producer Name], [Title]</div>"}</div></div>
    <div class="dash"></div><div class="contact">${contacts}</div></div>`;
}

function renderTable(t){
  const cols=t.cols; const widths=cols.some(c=>c.w);
  const cg=widths?`<colgroup>${cols.map(c=>`<col${c.w?` style="width:${c.w}%"`:""}>`).join("")}</colgroup>`:"";
  const al=c=>c.a==="c"?' class="c"':c.a==="r"?' class="r"':"";
  const head=`<thead><tr>${cols.map(c=>`<th${al(c)}>${esc(c.l)}</th>`).join("")}</tr></thead>`;
  const body=t.rows.map(r=>`<tr class="s-${r.s||"n"}">${cols.map((c,i)=>{const v=c.calc?calcCell(c,r.c):r.c[i]; return `<td${al(c)}>${rich(v)}</td>`;}).join("")}</tr>`).join("");
  let tot="";
  if(t.total){
    const sums=cols.map((c,i)=>{ if(!c.m||c.calc) return ""; const vals=t.rows.map(r=>num(r.c[i])); return vals.every(isNaN)?"":money(vals.reduce((a,b)=>a+(isNaN(b)?0:b),0)); });
    const cells=cols.map((c,i)=>i===0&&!c.m?"Total":c.calc?calcCell(c,sums):sums[i]);
    if(cols[0].m) cells[0]=sums[0];
    const firstText=cols.findIndex(c=>!c.m&&!c.calc);
    if(firstText>=0) cells[firstText]= cells[firstText]||"Total";
    tot=`<tr class="s-total">${cols.map((c,i)=>`<td${al(c)}>${esc(cells[i])}</td>`).join("")}</tr>`;
  }
  return `<table class="t">${cg}${head}<tbody>${body}${tot}</tbody></table>`;
}
function renderList(items, ordered){
  const tag=ordered?"ol":"ul"; let html=`<${tag}>`; let open=false;
  items.forEach(it=>{
    if(it.lv===1){ if(!open){ html=html.replace(/<\/li>$/,""); html+=`<${tag}>`; open=true; } html+=`<li>${rich(it.t)}</li>`; }
    else { if(open){ html+=`</${tag}></li>`; open=false; } html+=`<li>${rich(it.t)}</li>`; }
  });
  if(open) html+=`</${tag}></li>`;
  return html+`</${tag}>`;
}
function renderBlock(b){
  const h=b.heading?`<div class="bh">${rich(b.heading)}</div>`:"";
  if(b.type==="table") return `<div class="blk">${h}${renderTable(b)}</div>`;
  if(b.type==="bullets"||b.type==="numbered") return b.items.length?`<div class="blk">${h}${renderList(b.items,b.type==="numbered")}</div>`:(h?`<div class="blk">${h}</div>`:"");
  if(b.type==="text") return `<div class="blk">${h}${String(b.text||"").split(/\n\s*\n/).filter(x=>x.trim()).map(p=>`<p>${rich(p).replace(/\n/g,"<br>")}</p>`).join("")}</div>`;
  if(b.type==="kv") return `<div class="blk kv">${h}${b.items.filter(i=>i.k||i.v).map(i=>`<p>${rich(i.k)}${i.k&&i.v?": ":""}${rich(i.v)}</p>`).join("")}</div>`;
  return "";
}
function premiumTotals(s){
  const E=s.rows.map(r=>num(r.expP)), Pp=s.rows.map(r=>num(r.propP));
  const sum=a=>a.reduce((x,y)=>x+(isNaN(y)?0:y),0);
  const pending=s.rows.some(r=>String(r.propP).trim()&&isNaN(num(r.propP)));
  const eT=E.every(isNaN)?NaN:sum(E), pT=Pp.every(isNaN)?NaN:sum(Pp);
  return {eT,pT,pending};
}
function fmtPrem(v){ const n=num(v); return isNaN(n)?v:money(n); }
function renderPremium(s){
  const ex=s.showExpiring; const {eT,pT,pending}=premiumTotals(s);
  const pendCls=v=>String(v).trim()&&isNaN(num(v))?' style="color:#c00000"':"";
  const head=ex?`<tr><th style="width:24%">Coverage Type</th><th class="r" style="width:14%">Expiring Premium</th><th style="width:17%">Expiring Carrier</th><th class="r" style="width:14%">Proposed Premium</th><th style="width:17%">Proposed Carrier</th><th class="r" style="width:14%">YoY Change</th></tr>`
              :`<tr><th style="width:44%">Coverage Type</th><th class="r" style="width:22%">Proposed Premium</th><th style="width:34%">Proposed Carrier</th></tr>`;
  const rows=s.rows.filter(r=>String(r.propP).trim()||String(r.expP).trim()).map(r=>ex
    ?`<tr><td>${rich(r.cov)}</td><td class="r">${esc(fmtPrem(r.expP))}</td><td>${esc(r.expC)}</td><td class="r"${pendCls(r.propP)}>${esc(fmtPrem(r.propP))}</td><td>${esc(r.propC)}</td><td class="r">${esc(pct(num(r.expP),num(r.propP)))}</td></tr>`
    :`<tr><td>${rich(r.cov)}</td><td class="r"${pendCls(r.propP)}>${esc(fmtPrem(r.propP))}</td><td>${esc(r.propC)}</td></tr>`).join("");
  const plus=pending?"+":"";
  const tot=ex?`<tr class="s-total"><td>Total</td><td class="r">${esc(money(eT))}</td><td></td><td class="r">${esc(money(pT))}${plus}</td><td></td><td class="r">${esc(pct(eT,pT))}${pct(eT,pT)?plus:""}</td></tr>`
             :`<tr class="s-total"><td>Total</td><td class="r">${esc(money(pT))}${plus}</td><td></td></tr>`;
  return `<div class="blk"><table class="t"><thead>${head}</thead><tbody>${rows}${tot}</tbody></table>${s.foot?`<div class="foot">${rich(s.foot)}</div>`:""}</div>`;
}
function renderAcceptance(s){
  const box=st=>`<span class="box${st?" x":""}"></span>`;
  const rows=s.rows.filter(r=>r.cov).map(r=>`<tr><td>${rich(r.cov)}</td><td>${rich(r.detail)}</td>${s.showPrem?`<td class="r">${esc(fmtPrem(r.prem))}</td>`:""}<td class="c">${box(r.st==="accept")}</td><td class="c">${box(r.st==="decline")}</td></tr>`).join("");
  return `<div class="ack-intro">${String(s.intro||"").split(/\n\s*\n/).map(p=>`<p>${rich(p).replace(/\n/g,"<br>")}</p>`).join("")}</div>
   <div class="blk"><table class="t"><colgroup><col style="width:${s.showPrem?38:50}%"><col style="width:${s.showPrem?28:32}%">${s.showPrem?'<col style="width:16%">':""}<col style="width:9%"><col style="width:9%"></colgroup>

function renderSection(s){

  else if(s.kind==="consent") return `<div class="sec${s.newPage?" np":""}" id="pv-${s.id}"><div class="in">${renderConsent(s)}</div></div>`;
  return `<div class="sec${s.newPage?" np":""}" id="pv-${s.id}"><div class="bar">${esc(s.title)}</div><div class="in">${inner}</div></div>`;
}

function moveIn(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }
function delCol(t,idx){
  t.cols.splice(idx,1); t.rows.forEach(r=>r.c.splice(idx,1));
  t.cols.forEach(c=>{ if(!c.calc) return; if(c.calc.of.includes(idx)) c.calc=null; else c.calc.of=c.calc.of.map(i=>i>idx?i-1:i); });
}
function insertSection(s){
  const si=secIndex();
  if(si>=0) S.sections.splice(si+1,0,s);
  else { const ord=ORDER.indexOf(s.preset); let at=S.sections.findIndex(x=>ORDER.indexOf(x.preset)>ord); if(at<0) at=S.sections.length; S.sections.splice(at,0,s); }
  sel=s.id;
}
const ACT={
  select(el){ sel=el.dataset.id; renderNav(); renderEditor(); scrollPreviewTo(sel); $("#editor").scrollTop=0; },
  up(el){ const [a,i]=parentArr(el.dataset.p); moveIn(a,i,-1); },
  down(el){ const [a,i]=parentArr(el.dataset.p); moveIn(a,i,1); },
  del(el){ const [a,i]=parentArr(el.dataset.p); a.splice(i,1); },
  addPreparer(){ S.cover.preparers.push({name:"",title:"",email:""}); },
  addRow(el){ const t=getP(el.dataset.p); t.rows.push(R(Array(t.cols.length).fill(""))); },
  addCol(el){ const t=getP(el.dataset.p); t.cols.push(C("New column")); t.rows.forEach(r=>r.c.push("")); },
  delCol(el){ const t=getP(el.dataset.p); if(t.cols.length<2) return toast("A table needs at least one column."); delCol(t,+el.dataset.i); },
  addItem(el){ getP(el.dataset.p).items.push({t:"",lv:0}); },
  addKV(el){ getP(el.dataset.p).items.push({k:"",v:""}); },
  indent(el){ const it=getP(el.dataset.p); it.lv=it.lv?0:1; },
  addBlock(el){ const s=getP(el.dataset.p); const t=el.dataset.type;
    s.blocks.push(t==="table"?T("",[C("Coverage",{w:60}),C("Limit",{w:40})],blank(2,2)):t==="text"?X("",""):t==="kv"?KV("",[["",""]]):L(t,"",[""])); },
  addPremRow(el){ getP(el.dataset.p).rows.push({cov:"",expP:"",expC:"",propP:"",propC:""}); },
  addAccRow(el){ getP(el.dataset.p).rows.push({cov:"",detail:"",prem:"",st:""}); },
  pullPremiums(el){ const s=getP(el.dataset.p); const prem=S.sections.find(x=>x.kind==="premium"); if(!prem) return toast("There is no premium summary to pull from.");
    s.rows=s.rows.filter(r=>r.cov||r.detail||r.prem); let n=0;
    prem.rows.filter(r=>r.cov).forEach(r=>{ if(!s.rows.some(a=>a.cov.toLowerCase()===r.cov.toLowerCase())){ s.rows.push({cov:r.cov,detail:"",prem:r.propP,st:""}); n++; } });
    toast(n?`Added ${n} line${n>1?"s":""}. Remove any that aren't optional.`:"Every premium line is already listed."); },
  secUp(){ const i=secIndex(); moveIn(S.sections,i,-1); },
  secDown(){ const i=secIndex(); moveIn(S.sections,i,1); },
  secDup(){ const i=secIndex(); const c=clone(S.sections[i]); c.id=uid(); (c.blocks||[]).forEach(b=>b.id=uid()); S.sections.splice(i+1,0,c); sel=c.id; },
  secDel(){ const i=secIndex(); if(!confirm(`Remove “${S.sections[i].title}” from this proposal?`)) return "noop"; S.sections.splice(i,1); sel=S.sections[Math.min(i,S.sections.length-1)]?.id||"cover"; },
  togglePreview(){ showPreview=!showPreview; $("#main").classList.toggle("nopreview",!showPreview); $("#pvToggle").textContent=showPreview?"Hide preview":"Show preview"; renderPreview(); return "noop"; },
  newProposal(){ modalNew(); return "noop"; },
  openDraft(){ if(dirty&&!confirm("You have unsaved changes. Open a different draft anyway?")) return "noop"; $("#fileIn").value=""; $("#fileIn").click(); return "noop"; },
  saveDraft(){ saveDraft(); return "noop"; },
  openImport(){ modalImport(); return "noop"; },
  print(){ doPrint(); return "noop"; },
};
const STRUCT_NOOP=new Set(["select"]);
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act; if(!ACT[a]) return;
  e.preventDefault();
  const r=ACT[a](el);
  if(r==="noop"||STRUCT_NOOP.has(a)) return;
  markDirty(); renderAll();
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.p||el.type==="file") return;
  setP(el.dataset.p, el.type==="checkbox"?el.checked:el.value); markDirty();
  if(el.type==="checkbox"||el.tagName==="SELECT"){ renderAll(); return; }
  if(/\.(title|carrier|insured)$/.test(el.dataset.p)) renderNav();
  if(/\.c\.\d+$/.test(el.dataset.p)){ // refresh calculated cells in the editor row without stealing focus
    const tp=el.dataset.p.split(".rows.")[0]; const t=getP(tp); const ri=+el.dataset.p.split(".rows.")[1].split(".")[0];
    if(t.cols.some(c=>c.calc)){ const tr=el.closest("tr"); const dis=tr.querySelectorAll("input:disabled"); let k=0; t.cols.forEach(c=>{ if(c.calc&&dis[k]) dis[k++].value=calcCell(c,t.rows[ri].c); }); }
  }
  schedPreview();
});
document.addEventListener("change",e=>{
  if(e.target.id==="addSel"){ const v=e.target.value; if(!v) return; insertSection(makeSection(v)); markDirty(); renderAll(); $("#navAdd").innerHTML=addSelectHTML(); scrollPreviewTo(sel); }
});
$("#zoom").addEventListener("input",e=>{ const z=e.target.value/100; document.documentElement.style.setProperty("--z",z); $("#zoomVal").textContent=e.target.value+"%"; });

/* ===================================================================
   DRAFT FILES (saved wherever the producer chooses — never in the browser)
   =================================================================== */
function safeName(s){ return String(s||"Untitled").replace(/[\\/:*?"<>|]+/g,"").trim().slice(0,80)||"Untitled"; }
function download(name, text, type){ const url=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
function saveDraft(){
  const d=new Date(); const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  download(`${safeName(S.cover.insured)} - Proposal Draft ${stamp}.json`, JSON.stringify({app:APP_ID, version:DRAFT_VERSION, saved:d.toISOString(), state:S},null,1), "application/json");
  markClean(); toast("Draft downloaded. File it in the client's folder.");
}
function validState(st){ return st&&typeof st==="object"&&st.cover&&Array.isArray(st.sections); }
$("#fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  if(f.size>5e6) return toast("That file is too large to be a proposal draft.");
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!==APP_ID||!validState(d.state)) throw 0;
      S=d.state; S.sections.forEach(s=>{ s.id=s.id||uid(); }); sel="cover"; markClean(); renderAll(); toast("Draft opened."); }
    catch(_){ toast("That file isn't a Lightwell proposal draft."); } };
  r.readAsText(f);
});
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ===================================================================
   MODALS
   =================================================================== */
function modal(html){ $("#mbox").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); const b=e.target.closest("[data-m]"); if(!b) return; const m=b.dataset.m;
  if(m==="close") return closeModal();
  if(m.startsWith("start:")){ S=freshState(m.slice(6)); sel="cover"; markClean(); closeModal(); renderAll(); }
  if(m==="copyPrompt"){ copyText(buildPrompt()).then(ok=>toast(ok?"Extraction instructions copied.":"Copy blocked — select the text and copy it manually.")); }
  if(m==="showPrompt"){ $("#promptBox").style.display="block"; $("#promptBox").value=buildPrompt(); }
  if(m==="import"){ doImport($("#impText").value); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
function modalNew(){
  if(dirty&&!confirm("You have unsaved changes. Start a new proposal anyway?")) return;
  modal(`<h3>Start a new proposal</h3><p>Pick a starting layout. You can add, remove, and reorder sections afterward.</p>
   <button class="choice" data-m="start:empty"><b>Start lean (recommended with Import)</b><span>Cover, premium summary, options, binding, acceptance/rejection, and e-delivery consent. Importing from Claude adds only the coverage sections in the carrier proposal.</span></button>
   <button class="choice" data-m="start:blanket"><b>Full template — blanket</b><span>Every section from the blanket Word template, with placeholders.</span></button>
   <button class="choice" data-m="start:scheduled"><b>Full template — scheduled values</b><span>Every section from the scheduled-values Word template, with placeholders.</span></button>
   <div class="mact"><button class="btn" data-m="close">Cancel</button></div>`);
}
function modalImport(){
  modal(`<h3>Import from Claude</h3>
   <p><b>1.</b> In your Lightwell Claude workspace, open the proposal extraction project (or start a chat and paste the instructions below). <b>2.</b> Upload the carrier proposal PDF. <b>3.</b> Copy Claude's whole reply and paste it here.</p>
   <div class="mact" style="justify-content:flex-start;margin:0 0 10px"><button class="btn" data-m="copyPrompt">Copy extraction instructions</button><button class="btn" data-m="showPrompt">Show instructions</button></div>
   <textarea id="promptBox" readonly style="display:none;min-height:140px;margin-bottom:10px"></textarea>
   <textarea id="impText" placeholder="Paste Claude's JSON reply here"></textarea>
   <p class="hint">Imported sections replace sections of the same type. Premium lines merge into the premium summary. Review every number against the carrier proposal before printing.</p>
   <div class="mact"><button class="btn" data-m="close">Cancel</button><button class="btn dark" data-m="import">Import</button></div>`);
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(_){ try{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(__){ return false; } } }

/* ===================================================================
   CLAUDE EXTRACTION: prompt is generated from the presets so the two
   never drift apart.
   =================================================================== */
function buildPrompt(){
  const lines=[];
  PRESETS.filter(p=>!["premium","options","binding","acceptance","consent","custom"].includes(p.id)).forEach(p=>{
    const s=p.make(); const parts=[]; const k={table:0,bullets:0,numbered:0,text:0,kv:0};
    s.blocks.forEach(b=>{
      const key=b.type==="numbered"?"bullets":b.type; const i=k[key]++;
      if(b.type==="table") parts.push(`tables[${i}]${b.heading?` "${b.heading}"`:""}: columns ${b.cols.map(c=>c.l+(c.calc?" (calculated, leave \"\")":"")).join(" | ")}; example first column: ${b.rows.slice(0,6).map(r=>r.c[0]).filter(Boolean).map(x=>`"${x}"`).join(", ")||"(none)"}`);
      if(b.type==="bullets"||b.type==="numbered") parts.push(`lists[${i}]${b.heading?` "${b.heading}"`:""}`);
      if(b.type==="text") parts.push(`texts[${i}]${b.heading?` "${b.heading}"`:""}: ${b.text}`);
      if(b.type==="kv") parts.push(`fields[${i}]: ${b.items.map(x=>x.k).join(", ")}`);
    });
    lines.push(`- "${p.id}" (${s.title})${s.showCarrier?" — include carrier":""}\n    ${parts.join("\n    ")}`);
  });
  return `You are extracting data from an insurance carrier proposal so it can be loaded into Lightwell Insurance Advisors' proposal builder.

Return ONLY one JSON object. No commentary, no markdown, no code fences.

Rules:
- Copy limits, deductibles, retentions, dates, and premiums exactly as the carrier shows them (keep $ signs and commas).
- Never guess. If something is not in the document, leave it out or use "".
- Only include sections for coverages that actually appear in this proposal.
- For each table, list only rows that apply to this proposal, in the order a reader would expect. Use the example rows as naming guidance, not as required rows.
- A row is an array of cell strings in column order. For a heading row with indented rows beneath it, use {"cells":[...],"style":"group"}; for the indented rows use {"cells":[...],"style":"sub"}.
- Premiums go in "premiums", one entry per line of coverage, using the annual premium shown.
- Do not include client names of individuals, Social Security numbers, driver information, or bank details.

JSON shape:
{
  "cover": {"insured": "Named insured", "dates": "M.D.YYYY-M.D.YYYY"},
  "sections": [
    {"preset": "<id from list>", "carrier": "<carrier name>",
     "tables": [[ ["cell","cell"], ... ]],
     "lists":  [[ "note", "note" ]],
     "texts":  [ "paragraph text" ],
     "fields": [[ ["Label","Value"] ]]}
  ],
  "premiums": [{"coverage": "Package Policy", "premium": "$12,345", "carrier": "Carrier name"}]
}
"tables", "lists", "texts", and "fields" are positional: the first table in your output fills tables[0] of that section, and so on. Omit any you don't need.

Available sections (id, title, then what each position holds):
${lines.join("\n")}`;
}

function rowFrom(x,ncols){ const cells=Array.isArray(x)?x:(x&&Array.isArray(x.cells)?x.cells:[]); const st=x&&!Array.isArray(x)?({group:"grp",grp:"grp",sub:"sub",bold:"bold",highlight:"hl",hl:"hl"}[x.style]||""):"";
  const c=cells.slice(0,ncols).map(v=>v==null?"":String(v)); while(c.length<ncols) c.push(""); return R(c,st); }
function extractJSON(text){
  let t=String(text||"").trim().replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"");
  const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<a) throw new Error("No JSON object found in what you pasted.");
  return JSON.parse(t.slice(a,b+1));
}
function doImport(text){
  let d; try{ d=extractJSON(text); }catch(err){ return toast(err.message.startsWith("No JSON")?err.message:"Couldn't read that as JSON. Copy Claude's entire reply and try again."); }
  let added=0, replaced=0, prem=0;
  if(d.cover&&typeof d.cover==="object"){ if(d.cover.insured&&!S.cover.insured) S.cover.insured=String(d.cover.insured); if(d.cover.dates&&!S.cover.dates) S.cover.dates=String(d.cover.dates); }
  (Array.isArray(d.sections)?d.sections:[]).forEach(x=>{
    if(!x||!P[x.preset]||["premium","acceptance","consent"].includes(x.preset)) return;
    const s=makeSection(x.preset); if(x.carrier) s.carrier=String(x.carrier);
    const k={table:0,list:0,text:0,kv:0};
    s.blocks.forEach(b=>{
      if(b.type==="table"){ const src=(x.tables||[])[k.table++]; if(Array.isArray(src)) b.rows=src.map(r=>rowFrom(r,b.cols.length)); }
      else if(b.type==="bullets"||b.type==="numbered"){ const src=(x.lists||[])[k.list++]; if(Array.isArray(src)) b.items=src.map(t=>({t:String(t),lv:0})); }
      else if(b.type==="text"){ const src=(x.texts||[])[k.text++]; if(typeof src==="string") b.text=src; }
      else if(b.type==="kv"){ const src=(x.fields||[])[k.kv++]; if(Array.isArray(src)) b.items=src.filter(Array.isArray).map(([kk,v])=>({k:String(kk??""),v:String(v??"")})); }
    });
    const at=S.sections.findIndex(o=>o.preset===x.preset);
    if(at>=0){ s.newPage=S.sections[at].newPage; S.sections[at]=s; replaced++; }
    else { const ord=ORDER.indexOf(s.preset); let pos=S.sections.findIndex(o=>ORDER.indexOf(o.preset)>ord); if(pos<0) pos=S.sections.length; S.sections.splice(pos,0,s); added++; }
  });
  if(Array.isArray(d.premiums)&&d.premiums.length){
    let ps=S.sections.find(o=>o.kind==="premium");
    if(!ps){ ps=makeSection("premium"); ps.rows=[]; const pos=S.sections.findIndex(o=>ORDER.indexOf(o.preset)>ORDER.indexOf("premium")); S.sections.splice(pos<0?S.sections.length:pos,0,ps); }
    ps.rows=ps.rows.filter(r=>r.cov||r.propP||r.expP);
    d.premiums.forEach(p=>{ if(!p||!p.coverage) return; const name=String(p.coverage); const row=ps.rows.find(r=>r.cov.toLowerCase()===name.toLowerCase());
      if(row){ row.propP=String(p.premium??""); if(p.carrier) row.propC=String(p.carrier); } else ps.rows.push({cov:name,expP:"",expC:"",propP:String(p.premium??""),propC:String(p.carrier??"")}); prem++; });
  }
  closeModal(); markDirty(); renderAll();
  toast(`Imported: ${added} new section${added===1?"":"s"}, ${replaced} replaced, ${prem} premium line${prem===1?"":"s"}. Check every figure.`);
}

/* ===================================================================
   PRINT
   =================================================================== */
function placeholders(){
  const found=[]; const re=/\[[^\[\]\n]{1,40}\]/g;
  const scan=(v,where)=>{ if(typeof v==="string"){ const m=v.match(re); if(m) m.forEach(x=>found.push(where+": "+x)); } else if(v&&typeof v==="object") Object.values(v).forEach(x=>scan(x,where)); };
  ["title","insured","dates"].forEach(k=>scan(S.cover[k],"Cover"));
  if(!S.cover.insured) found.push("Cover: insured name is blank");
  S.sections.forEach(s=>{ if(s.kind==="consent") return; scan(s.blocks||s.rows,s.title); if(s.kind==="std"&&s.showCarrier&&!s.carrier) found.push(s.title+": proposed carrier is blank"); });
  return found;
}
function doPrint(){
  const ph=placeholders();
  if(ph.length){ const list=ph.slice(0,8).map(x=>"• "+x).join("\n")+(ph.length>8?`\n…and ${ph.length-8} more`:"");
    if(!confirm(`${ph.length} item${ph.length>1?"s":""} still look unfinished:\n\n${list}\n\nPrint anyway?`)) return; }
  $("#printRoot").innerHTML=renderDoc();
  const old=document.title; document.title=`${safeName(S.cover.insured)} - Lightwell Proposal`;
  setTimeout(()=>{ window.print(); document.title=old; $("#printRoot").innerHTML=""; },60);
}

/* ---------- init ---------- */
$("#navAdd").innerHTML=addSelectHTML();
document.documentElement.style.setProperty("--z",.55);
renderAll();

</script>
